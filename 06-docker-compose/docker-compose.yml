# docker-compose.yml
# Full MERN stack: React frontend + Express backend + MongoDB

services:

  # ============================================
  # MongoDB Database
  # ============================================
  mongo:
    image: mongo:7
    container_name: mern-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=mernapp
    restart: unless-stopped

  # ============================================
  # Express.js Backend API
  # ============================================
  backend:
    build: ./backend
    container_name: mern-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGO_URL=mongodb://mongo:27017/mernapp
    depends_on:
      - mongo
    restart: unless-stopped

  # ============================================
  # React Frontend
  # ============================================
  frontend:
    build: ./frontend
    container_name: mern-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

# ============================================
# Named Volumes (for data persistence)
# ============================================
volumes:
  mongo-data:
